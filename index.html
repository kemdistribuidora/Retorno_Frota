<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retorno de Frota</title>
  <link rel="icon" type="image/png" href="imagens/icone.png">
  <link rel="apple-touch-icon" href="imagens/icone.png">
  <style>
  :root {
    /* Cores da marca KEM - Importadas do Base */
    --azul: #123a6b;
    --azul-escuro: #0e2e56;
    --azul-clarinho: #eaf1fb;
    --laranja: #f7941d;
    --vermelho: #e5341f;
    --grad: linear-gradient(135deg, #f7a81b, #e5341f);

    --fundo: #eef1f6;
    --texto: #1f2733;
    --texto-suave: #5b6675;
    --borda: #c7cfdb;
    --borda-forte: var(--azul);
    --ok: #1f8a4c;
    --ok-escuro: #176c3b;
    --erro: #c5221f;
    --aviso-bg: #fdecea;
  }

  * { box-sizing: border-box; }

  html { background: var(--fundo); }

  body {
    margin: 0 auto;
    max-width: min(1500px, 97vw);
    padding: 16px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    color: var(--texto);
  }

  /* ---------- Barra do topo ---------- */
  .topo {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    background: #fff;
    border: 1px solid var(--borda);
    border-top: 5px solid transparent;
    border-image: var(--grad) 1;
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(18, 58, 107, .08);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .logo { height: 54px; width: auto; display: block; }

  .titulo { margin-right: auto; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titulo h1 {
    margin: 0;
    font-size: 22px;
    font-weight: bold;
    color: var(--azul);
  }
  .titulo .sub { font-size: 13px; color: var(--texto-suave); font-weight: bold; }

  .acoes {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .campo-data { display: flex; align-items: center; gap: 8px; }
  .campo-data label { font-weight: bold; color: var(--azul); }
  .campo-data input {
    font-size: 18px;
    padding: 10px;
    border: 2px solid var(--borda);
    border-radius: 8px;
    font-family: inherit;
  }
  .campo-data input:focus { outline: none; border-color: var(--azul); }

  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    padding: 13px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

  .btn-salvar { background: var(--ok); color: #fff; box-shadow: 0 2px 0 var(--ok-escuro); }
  .btn-salvar:hover { background: var(--ok-escuro); }
  .btn-salvar:active { transform: translateY(1px); box-shadow: none; }
  .btn-salvar:disabled { background: #a9b2c0; box-shadow: none; cursor: default; }

  .btn-atualizar { background: var(--azul); color: #fff; box-shadow: 0 2px 0 var(--azul-escuro); }
  .btn-atualizar:hover { background: var(--azul-escuro); }
  .btn-atualizar:active { transform: translateY(1px); box-shadow: none; }

  .status {
    font-weight: bold;
    color: var(--ok);
    font-size: 15px;
  }
  .status.erro { color: var(--erro); }
  .status.pendente { color: var(--vermelho); }

  /* ---------- Grid (Moldura) ---------- */
  .moldura {
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 12px;
    overflow-x: auto; 
    overflow-y: auto;
    max-height: calc(100vh - 200px);
    box-shadow: 0 2px 8px rgba(18, 58, 107, .08);
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1450px;
    table-layout: fixed;
    background: #fff;
  }

  th, td {
    border: 1px solid #dfe4ec;
    padding: 0;
    text-align: center;
    height: 52px;
  }

  thead th {
    background: var(--azul);
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: .6px;
    padding: 12px 8px;
    line-height: 1.15;
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  /* Larguras das colunas do Retorno de Frota */
  .col-hora { width: 110px; }
  .col-frota { width: 130px; }
  .col-nf { width: 130px; }
  .col-quantidade { width: 140px; }
  .col-produto { width: 260px; }
  .col-motorista { width: 240px; }
  .col-caixas { width: 110px; }
  .col-conferente { width: 185px; }
  .col-paletes { width: 110px; }

  /* ---------- Campos internos da tabela ---------- */
  .celula-input {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    color: var(--texto);
    text-align: center;
    padding: 6px 12px;
    outline: none;
  }

  select.celula-input {
    cursor: pointer;
  }

  .celula-input::placeholder { 
    color: #b7c0cd; 
    font-weight: normal;
  }

  .celula-input.hora {
    color: var(--azul);
    font-size: 20px;
  }

  .celula-input:focus {
    outline: 3px solid var(--laranja);
    outline-offset: -3px;
    background: #fff7ec;
  }

  tbody tr:nth-child(even) td { background: #fafbfd; }
  tbody tr:hover td { background: #fff7ec; }

  @media (max-width: 1050px) {
    .topo { flex-wrap: wrap; gap: 12px; }
    .acoes { width: 100%; flex-wrap: wrap; }
    .status { white-space: normal; }
  }

  @media (max-width: 700px) {
    .titulo h1 { font-size: 18px; }
    .logo { height: 42px; }
    .campo-data input { width: 155px; font-size: 16px; }
    .btn-salvar, .btn-atualizar { width: 100%; }
  }
  </style>
</head>
<body>

  <header class="topo">
    <img class="logo" src="imagens/Distribuidora_KEM.png" alt="Kem Distribuidora de Alimentos">
    <div class="titulo">
      <h1>Retorno de Frota</h1>
      <div class="sub">Controle de retorno</div>
    </div>
    <div class="acoes">
      <div class="campo-data">
        <label for="dataLancamento">Data:</label>
        <input id="dataLancamento" type="date">
      </div>
      <button class="btn-salvar" id="salvar" type="button">Salvar na planilha</button>
      <button class="btn-atualizar" id="atualizar" type="button">Atualizar</button>
    </div>
    <div class="status" id="status">Nada lançado ainda nesta data</div>
  </header>

  <section class="moldura" aria-label="Lançamentos de retorno de frota">
    <table>
      <thead>
        <tr>
          <th class="col-hora">Hora</th>
          <th class="col-frota">Frota</th>
          <th class="col-nf">Nº da NF</th>
          <th class="col-quantidade">Quantidade</th>
          <th class="col-produto">Produto</th>
          <th class="col-motorista">Motorista/Ajudante</th>
          <th class="col-caixas">Caixas</th>
          <th class="col-conferente">Conferente</th>
          <th class="col-paletes">Paletes</th>
        </tr>
      </thead>
      <tbody id="linhas"></tbody>
    </table>
  </section>

  <script>
    const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxGDlgoUvvVvjUO_7O6h6veBpjDaPgMG6rzqgVJmY_Ad1DVz-rYPm-egcG8XjIFVh8Q1w/exec';
    const gridLinhas = document.getElementById('linhas');
    const dataLancamento = document.getElementById('dataLancamento');
    const statusLabel = document.getElementById('status');

    const hoje = new Date();
    dataLancamento.value = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;

    const gerarCampo = (tipo, placeholder = '', classe = '', extra = '') =>
      `<td><input type="${tipo}" class="celula-input ${classe}" placeholder="${placeholder}" ${extra}></td>`;

    function adicionarLinha() {
      gridLinhas.insertAdjacentHTML('beforeend', `
        <tr>
          ${gerarCampo('text', '--:--', 'hora', 'maxlength="5" inputmode="numeric"')}
          ${gerarCampo('text', 'Frota')}
          ${gerarCampo('text', 'Nº da NF')}
          ${gerarCampo('number', '0', '', 'min="0" step="any"')}
          ${gerarCampo('text', 'Produto')}
          ${gerarCampo('text', 'Motorista / Ajudante')}
          ${gerarCampo('number', '0', '', 'min="0" step="1"')}
          <td>
            <select class="celula-input" aria-label="Conferente">
              <option value=""></option>
              <option>Alzoni</option>
              <option>João Paulo</option>
              <option>Francisco</option>
              <option>Alaor</option>
            </select>
          </td>
          ${gerarCampo('number', '0', '', 'min="0" step="any"')}
        </tr>`);
        aplicarMascaras();
    }

    for (let numero = 1; numero <= 10; numero++) adicionarLinha();

    function valorDaCelula(celula) {
      return celula.querySelector('input, select').value.trim();
    }

    function obterDadosDaLinha(linha) {
      const celulas = linha.cells;
      return {
        data: dataLancamento.value,
        hora: valorDaCelula(celulas[0]),
        frota: valorDaCelula(celulas[1]),
        nfe: valorDaCelula(celulas[2]),
        quantidade: valorDaCelula(celulas[3]),
        produto: valorDaCelula(celulas[4]),
        motorista: valorDaCelula(celulas[5]),
        caixas: valorDaCelula(celulas[6]),
        conferente: valorDaCelula(celulas[7]),
        paletes: valorDaCelula(celulas[8])
      };
    }

    function assinaturaDoLancamento(lancamento) {
      return JSON.stringify([
        lancamento.data, lancamento.hora, lancamento.frota, lancamento.nfe,
        lancamento.quantidade, lancamento.produto, lancamento.motorista,
        lancamento.caixas, lancamento.conferente, lancamento.paletes
      ]);
    }

    function obterLancamentos() {
      return [...gridLinhas.rows]
        .map(linha => {
          const lancamento = obterDadosDaLinha(linha);
          const possuiConteudo = Object.entries(lancamento)
            .some(([campo, valor]) => campo !== 'data' && valor !== '');
          if (!possuiConteudo) return null;

          const linhaPlanilha = Number(linha.dataset.linhaPlanilha) || null;
          const foiAlterado = assinaturaDoLancamento(lancamento) !== linha.dataset.assinatura;
          return foiAlterado ? { ...lancamento, linhaPlanilha } : null;
        })
        .filter(Boolean);
    }

    function marcarLancamentosComoSalvos() {
      [...gridLinhas.rows].forEach(linha => {
        const lancamento = obterDadosDaLinha(linha);
        const possuiConteudo = Object.entries(lancamento)
          .some(([campo, valor]) => campo !== 'data' && valor !== '');
        if (!possuiConteudo) return;
        linha.dataset.assinatura = assinaturaDoLancamento(lancamento);
      });
    }

    async function enviarParaAppsScript(payload) {
      const corpo = new URLSearchParams();
      corpo.append('payload', JSON.stringify(payload));
      
      await fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        mode: 'no-cors',
        body: corpo
      });
    }

    function preencherLancamentos(lancamentos) {
      while (gridLinhas.rows.length < Math.max(10, lancamentos.length)) adicionarLinha();

       [...gridLinhas.rows].forEach((linha, indice) => {
        const campos = linha.querySelectorAll('input, select');
        campos.forEach(campo => { campo.value = ''; });
        delete linha.dataset.linhaPlanilha;
        delete linha.dataset.assinatura;

        const lancamento = lancamentos[indice];
        if (!lancamento) return;

        const valores = [
          lancamento.hora, lancamento.frota, lancamento.nfe,
          lancamento.quantidade, lancamento.produto, lancamento.motorista,
          lancamento.caixas, lancamento.conferente, lancamento.paletes
        ];
        campos.forEach((campo, campoIndice) => {
          campo.value = valores[campoIndice] ?? '';
        });
        linha.dataset.linhaPlanilha = lancamento.linhaPlanilha;
        linha.dataset.assinatura = assinaturaDoLancamento(obterDadosDaLinha(linha));
      });
    }

    function buscarLancamentosPorData() {
      if (!dataLancamento.value) {
        statusLabel.textContent = 'Informe a data para atualizar.';
        statusLabel.className = 'status pendente';
        dataLancamento.focus();
        return;
      }

      const nomeCallback = `retornoFrotas${Date.now()}`;
      const script = document.createElement('script');
      statusLabel.textContent = 'Buscando lançamentos na planilha...';
      statusLabel.className = 'status';

      window[nomeCallback] = resposta => {
        script.remove();
        delete window[nomeCallback];
        if (!resposta.sucesso) {
          statusLabel.textContent = resposta.mensagem || 'Não foi possível buscar os lançamentos.';
          statusLabel.className = 'status erro';
          return;
        }

        const lancamentos = resposta.lancamentos || [];
        preencherLancamentos(lancamentos);
        statusLabel.textContent = lancamentos.length
          ? `${lancamentos.length} lançamento(s) carregado(s) para esta data.`
          : 'Nenhum lançamento encontrado para esta data.';
        statusLabel.className = 'status ok';
      };

      script.onerror = () => {
        script.remove();
        delete window[nomeCallback];
        statusLabel.textContent = 'Não foi possível consultar a planilha.';
        statusLabel.className = 'status erro';
      };
      script.src = `${URL_APPS_SCRIPT}?acao=listarRecebimentos&data=${encodeURIComponent(dataLancamento.value)}&callback=${nomeCallback}`;
      document.head.appendChild(script);
    }

    document.getElementById('salvar').addEventListener('click', async () => {
      const lancamentos = obterLancamentos();
      const setor = 'RetornoFrota';

      if (!dataLancamento.value) {
        statusLabel.textContent = 'Informe a data do lançamento.';
        statusLabel.className = 'status pendente';
        dataLancamento.focus();
        return;
      }

      if (!lancamentos.length) {
        statusLabel.textContent = 'Nenhuma alteração para salvar.';
        statusLabel.className = 'status';
        return;
      }

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(mensagem => {
            marcarLancamentosComoSalvos();
            statusLabel.textContent = mensagem || `${lancamentos.length} lançamento(s) salvo(s) com sucesso.`;
            statusLabel.className = 'status ok';
            buscarLancamentosPorData();
          })
          .withFailureHandler(erro => {
            statusLabel.textContent = `Não foi possível salvar: ${erro.message || erro}`;
            statusLabel.className = 'status erro';
          })
          .salvarRecebimentos(setor, lancamentos);
        return;
      }

      try {
        statusLabel.textContent = 'Enviando lançamentos para a planilha...';
        statusLabel.className = 'status';
        await enviarParaAppsScript({ setor, lancamentos });
        marcarLancamentosComoSalvos();
        statusLabel.textContent = `${lancamentos.length} lançamento(s) enviado(s). Confira a planilha em instantes.`;
        statusLabel.className = 'status ok';
        window.setTimeout(buscarLancamentosPorData, 800);
      } catch (erro) {
        statusLabel.textContent = `Falha ao enviar: ${erro.message || erro}`;
        statusLabel.className = 'status erro';
      }
    });

    document.getElementById('atualizar').addEventListener('click', buscarLancamentosPorData);
    
    function aplicarMascaras() {
      document.querySelectorAll('.hora').forEach(inp => {
        if (inp.dataset.mask) return;
        inp.dataset.mask = '1';

        inp.addEventListener('input', () => {
          let d = inp.value.replace(/\D/g, '').slice(0,4);
          inp.value = d.length >= 3 ? d.slice(0,2) + ':' + d.slice(2) : d;
        });

        inp.addEventListener('blur', () => {
          let p = inp.value.split(':');
          if (p.length !== 2) { inp.value = ''; return; }
          let h = Number(p[0]);
          let m = Number(p[1]);
          if (isNaN(h) || isNaN(m) || h > 23 || m > 59) { inp.value = ''; return; }
          inp.value = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
        });
      });
    }
  </script>
</body>
</html>
